basePath: /api
definitions:
  github_com_projecthelena_warden_internal_db.APIKey:
    properties:
      createdAt:
        type: string
      id:
        type: integer
      keyPrefix:
        type: string
      lastUsed:
        type: string
      name:
        type: string
      role:
        type: string
    type: object
  github_com_projecthelena_warden_internal_db.CheckResult:
    properties:
      latency:
        type: integer
      monitorId:
        type: string
      status:
        type: string
      statusCode:
        type: integer
      timestamp:
        type: string
    type: object
  github_com_projecthelena_warden_internal_db.Group:
    properties:
      createdAt:
        type: string
      id:
        type: string
      monitors:
        items:
          $ref: '#/definitions/github_com_projecthelena_warden_internal_db.Monitor'
        type: array
      name:
        type: string
    type: object
  github_com_projecthelena_warden_internal_db.Incident:
    properties:
      affectedGroups:
        description: JSON array
        type: string
      createdAt:
        type: string
      description:
        type: string
      endTime:
        type: string
      id:
        type: string
      outageId:
        description: nullable FK to monitor_outages
        type: integer
      public:
        description: visible on public status page
        type: boolean
      severity:
        description: minor | major | critical
        type: string
      source:
        description: '"auto" | "manual"'
        type: string
      startTime:
        type: string
      status:
        description: investigation | identified | ... | scheduled | in_progress |
          completed
        type: string
      title:
        type: string
      type:
        description: incident | maintenance
        type: string
    type: object
  github_com_projecthelena_warden_internal_db.IncidentUpdate:
    properties:
      createdAt:
        type: string
      id:
        type: integer
      incidentId:
        type: string
      message:
        type: string
      status:
        type: string
    type: object
  github_com_projecthelena_warden_internal_db.Monitor:
    properties:
      active:
        type: boolean
      confirmationThreshold:
        type: integer
      createdAt:
        type: string
      groupId:
        type: string
      id:
        type: string
      interval:
        description: Seconds
        type: integer
      latencyThreshold:
        type: integer
      name:
        type: string
      notificationCooldownMinutes:
        type: integer
      requestConfig:
        $ref: '#/definitions/github_com_projecthelena_warden_internal_db.RequestConfig'
      type:
        description: |-
          Type selects the check performed against URL: http, tcp, ping or dns.
          Empty means http, so monitors created before check types existed keep working.
        type: string
      url:
        type: string
    type: object
  github_com_projecthelena_warden_internal_db.NotificationChannel:
    properties:
      config:
        description: JSON string
        type: string
      createdAt:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      name:
        type: string
      type:
        type: string
    type: object
  github_com_projecthelena_warden_internal_db.RequestConfig:
    properties:
      acceptedStatusCodes:
        type: string
      body:
        type: string
      dnsRecordType:
        description: DNS-only options.
        type: string
      dnsResolver:
        description: resolver to query, host or host:port (default system)
        type: string
      followRedirects:
        type: boolean
      headers:
        additionalProperties:
          type: string
        type: object
      method:
        type: string
      retryCount:
        type: integer
      timeoutSeconds:
        type: integer
    type: object
  github_com_projecthelena_warden_internal_db.SystemStats:
    properties:
      activeMonitors:
        type: integer
      dailyPingsEstimate:
        type: integer
      degradedMonitors:
        type: integer
      downMonitors:
        type: integer
      totalGroups:
        type: integer
      totalMonitors:
        type: integer
    type: object
  internal_api.CreatedMonitor:
    properties:
      active:
        type: boolean
      confirmationThreshold:
        type: integer
      createdAt:
        type: string
      groupId:
        type: string
      id:
        type: string
      interval:
        description: Seconds
        type: integer
      latencyThreshold:
        type: integer
      name:
        type: string
      notificationCooldownMinutes:
        type: integer
      requestConfig:
        $ref: '#/definitions/github_com_projecthelena_warden_internal_db.RequestConfig'
      type:
        description: |-
          Type selects the check performed against URL: http, tcp, ping or dns.
          Empty means http, so monitors created before check types existed keep working.
        type: string
      url:
        type: string
      warning:
        type: string
    type: object
  internal_api.GroupDTO:
    properties:
      id:
        type: string
      monitors:
        items:
          $ref: '#/definitions/internal_api.MonitorDTO'
        type: array
      name:
        type: string
    type: object
  internal_api.GroupOverviewDTO:
    properties:
      id:
        type: string
      name:
        type: string
      status:
        description: up, down, degraded
        type: string
    type: object
  internal_api.HistoryPoint:
    properties:
      latency:
        type: integer
      status:
        type: string
      statusCode:
        type: integer
      timestamp:
        type: string
    type: object
  internal_api.IncidentDTO:
    properties:
      duration:
        type: string
      groupId:
        type: string
      groupName:
        type: string
      id:
        type: string
      message:
        type: string
      monitorId:
        type: string
      monitorName:
        type: string
      resolvedAt:
        description: Null if active
        type: string
      startedAt:
        type: string
      type:
        description: down, degraded, ssl_expiring
        type: string
    type: object
  internal_api.IncidentResponseDTO:
    properties:
      affectedGroups:
        items:
          type: string
        type: array
      createdAt:
        type: string
      description:
        type: string
      endTime:
        type: string
      id:
        type: string
      outageId:
        type: integer
      public:
        type: boolean
      severity:
        type: string
      source:
        type: string
      startTime:
        type: string
      status:
        type: string
      title:
        type: string
      type:
        type: string
      updates:
        items:
          $ref: '#/definitions/github_com_projecthelena_warden_internal_db.IncidentUpdate'
        type: array
    type: object
  internal_api.MaintenanceResponse:
    properties:
      affectedGroups:
        items:
          type: string
        type: array
      createdAt:
        type: string
      description:
        type: string
      endTime:
        type: string
      id:
        type: string
      severity:
        type: string
      startTime:
        type: string
      status:
        type: string
      title:
        type: string
      type:
        type: string
    type: object
  internal_api.MonitorDTO:
    properties:
      active:
        type: boolean
      confirmationThreshold:
        type: integer
      events:
        items:
          $ref: '#/definitions/internal_api.MonitorEvent'
        type: array
      history:
        items:
          $ref: '#/definitions/internal_api.HistoryPoint'
        type: array
      id:
        type: string
      interval:
        type: integer
      lastCheck:
        type: string
      latency:
        type: integer
      latencyThreshold:
        type: integer
      name:
        type: string
      notificationCooldownMinutes:
        type: integer
      requestConfig:
        $ref: '#/definitions/github_com_projecthelena_warden_internal_db.RequestConfig'
      status:
        type: string
      type:
        type: string
      url:
        type: string
    type: object
  internal_api.MonitorEvent:
    properties:
      errorMessage:
        type: string
      id:
        type: string
      latency:
        type: integer
      message:
        type: string
      responseBody:
        type: string
      responseHeaders:
        additionalProperties:
          type: string
        type: object
      statusCode:
        type: integer
      timestamp:
        type: string
      type:
        type: string
    type: object
  internal_api.MonitorEventDTO:
    properties:
      errorMessage:
        type: string
      id:
        type: string
      latency:
        type: integer
      message:
        type: string
      responseBody:
        type: string
      responseHeaders:
        additionalProperties:
          type: string
        type: object
      statusCode:
        type: integer
      timestamp:
        type: string
      type:
        type: string
    type: object
  internal_api.OverviewResponse:
    properties:
      groups:
        items:
          $ref: '#/definitions/internal_api.GroupOverviewDTO'
        type: array
    type: object
  internal_api.SSLWarningDTO:
    properties:
      groupId:
        type: string
      groupName:
        type: string
      id:
        type: string
      message:
        type: string
      monitorId:
        type: string
      monitorName:
        type: string
      timestamp:
        type: string
      type:
        description: always "ssl_expiring"
        type: string
    type: object
  internal_api.UptimeResponse:
    properties:
      groups:
        items:
          $ref: '#/definitions/internal_api.GroupDTO'
        type: array
    type: object
info:
  contact: {}
  description: Self-hosted uptime monitoring API by Project Helena.
  title: Warden API
  version: "1.0"
paths:
  /api-keys:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              keys:
                items:
                  $ref: '#/definitions/github_com_projecthelena_warden_internal_db.APIKey'
                type: array
            type: object
      security:
      - BearerAuth: []
      summary: List API keys
      tags:
      - api-keys
    post:
      consumes:
      - application/json
      parameters:
      - description: Key name
        in: body
        name: body
        required: true
        schema:
          properties:
            name:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              key:
                type: string
              message:
                type: string
            type: object
        "400":
          description: Name is required
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create API key
      tags:
      - api-keys
  /api-keys/{id}:
    delete:
      parameters:
      - description: Key ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              message:
                type: string
            type: object
        "400":
          description: Invalid ID
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete API key
      tags:
      - api-keys
  /events:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              active:
                items:
                  $ref: '#/definitions/internal_api.IncidentDTO'
                type: array
              history:
                items:
                  $ref: '#/definitions/internal_api.IncidentDTO'
                type: array
              sslWarnings:
                items:
                  $ref: '#/definitions/internal_api.SSLWarningDTO'
                type: array
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get system events
      tags:
      - events
  /groups:
    post:
      consumes:
      - application/json
      parameters:
      - description: Group payload
        in: body
        name: body
        required: true
        schema:
          properties:
            name:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_projecthelena_warden_internal_db.Group'
        "400":
          description: Name is required
          schema:
            type: string
        "409":
          description: Group already exists
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create group
      tags:
      - groups
  /groups/{id}:
    delete:
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: ID required
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Delete group
      tags:
      - groups
    put:
      consumes:
      - application/json
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: string
      - description: New name
        in: body
        name: body
        required: true
        schema:
          properties:
            name:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              name:
                type: string
            type: object
        "400":
          description: Name is required
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Update group
      tags:
      - groups
  /incidents:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_api.IncidentResponseDTO'
            type: array
        "500":
          description: Failed to fetch incidents
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: List incidents
      tags:
      - incidents
    post:
      consumes:
      - application/json
      parameters:
      - description: Incident payload
        in: body
        name: body
        required: true
        schema:
          properties:
            affectedGroups:
              items:
                type: string
              type: array
            description:
              type: string
            severity:
              type: string
            startTime:
              type: string
            status:
              type: string
            title:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_projecthelena_warden_internal_db.Incident'
        "400":
          description: Invalid request body
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Create incident
      tags:
      - incidents
  /incidents/{id}:
    delete:
      parameters:
      - description: Incident ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "500":
          description: Failed to delete incident
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Delete incident
      tags:
      - incidents
    get:
      parameters:
      - description: Incident ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.IncidentResponseDTO'
        "404":
          description: Incident not found
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get incident with timeline
      tags:
      - incidents
    put:
      consumes:
      - application/json
      parameters:
      - description: Incident ID
        in: path
        name: id
        required: true
        type: string
      - description: Incident payload
        in: body
        name: body
        required: true
        schema:
          properties:
            affectedGroups:
              items:
                type: string
              type: array
            description:
              type: string
            endTime:
              type: string
            public:
              type: boolean
            severity:
              type: string
            startTime:
              type: string
            status:
              type: string
            title:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.IncidentResponseDTO'
        "400":
          description: Invalid request body
          schema:
            type: string
        "404":
          description: Incident not found
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Update incident
      tags:
      - incidents
  /incidents/{id}/updates:
    get:
      parameters:
      - description: Incident ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_projecthelena_warden_internal_db.IncidentUpdate'
            type: array
        "404":
          description: Incident not found
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get incident updates
      tags:
      - incidents
    post:
      consumes:
      - application/json
      parameters:
      - description: Incident ID
        in: path
        name: id
        required: true
        type: string
      - description: Update details
        in: body
        name: body
        required: true
        schema:
          properties:
            message:
              type: string
            status:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_projecthelena_warden_internal_db.IncidentUpdate'
        "400":
          description: Invalid request body
          schema:
            type: string
        "404":
          description: Incident not found
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Add incident update
      tags:
      - incidents
  /incidents/{id}/visibility:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Incident ID
        in: path
        name: id
        required: true
        type: string
      - description: Visibility setting
        in: body
        name: body
        required: true
        schema:
          properties:
            public:
              type: boolean
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              message:
                type: string
              public:
                type: boolean
            type: object
        "400":
          description: Invalid request body
          schema:
            type: string
        "404":
          description: Incident not found
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Set incident visibility
      tags:
      - incidents
  /maintenance:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_api.MaintenanceResponse'
            type: array
        "500":
          description: Failed to fetch maintenance events
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: List maintenance windows
      tags:
      - maintenance
    post:
      consumes:
      - application/json
      parameters:
      - description: Maintenance payload
        in: body
        name: body
        required: true
        schema:
          properties:
            affectedGroups:
              items:
                type: string
              type: array
            description:
              type: string
            endTime:
              type: string
            startTime:
              type: string
            status:
              type: string
            title:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_api.MaintenanceResponse'
        "400":
          description: Invalid request body
          schema:
            type: string
        "500":
          description: Failed to schedule maintenance
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Create maintenance
      tags:
      - maintenance
  /maintenance/{id}:
    delete:
      parameters:
      - description: Maintenance ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              success:
                type: boolean
            type: object
        "400":
          description: Maintenance ID required
          schema:
            type: string
        "500":
          description: Failed to delete maintenance
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Delete maintenance
      tags:
      - maintenance
    put:
      consumes:
      - application/json
      parameters:
      - description: Maintenance ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated maintenance
        in: body
        name: body
        required: true
        schema:
          properties:
            affectedGroups:
              items:
                type: string
              type: array
            description:
              type: string
            endTime:
              type: string
            startTime:
              type: string
            status:
              type: string
            title:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.MaintenanceResponse'
        "400":
          description: Invalid request body
          schema:
            type: string
        "500":
          description: Failed to update maintenance
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Update maintenance
      tags:
      - maintenance
  /monitors:
    post:
      consumes:
      - application/json
      parameters:
      - description: Monitor payload. type is one of http, tcp, ping, dns (default
          http)
        in: body
        name: body
        required: true
        schema:
          properties:
            groupId:
              type: string
            interval:
              type: integer
            name:
              type: string
            type:
              type: string
            url:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_api.CreatedMonitor'
        "400":
          description: Validation error
          schema:
            type: string
        "404":
          description: Group not found
          schema:
            type: string
        "409":
          description: Monitor name already exists
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Create monitor
      tags:
      - monitors
  /monitors/{id}:
    delete:
      parameters:
      - description: Monitor ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: ID required
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Delete monitor
      tags:
      - monitors
    put:
      consumes:
      - application/json
      parameters:
      - description: Monitor ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update. Omit type to keep the stored one
        in: body
        name: body
        required: true
        schema:
          properties:
            interval:
              type: integer
            name:
              type: string
            type:
              type: string
            url:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: ID required
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Update monitor
      tags:
      - monitors
  /monitors/{id}/events:
    get:
      parameters:
      - description: Monitor ID
        in: path
        name: id
        required: true
        type: string
      - description: Date filter YYYY-MM-DD (UTC). If omitted and from/to are also
          omitted, returns the most recent N events.
        in: query
        name: date
        type: string
      - description: Range start (RFC3339). Used with `to` to drill into an outage
          window.
        in: query
        name: from
        type: string
      - description: Range end (RFC3339). Used with `from`.
        in: query
        name: to
        type: string
      - description: Max events to return (default 100, max 500)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
