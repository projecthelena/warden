name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  NODE_VERSION: "22"
  GO_VERSION: "1.25.13"
  # Pinned: installing these @latest means a new upstream release can add rules and break
  # CI on code that never changed. Renovate bumps them deliberately instead.
  GOSEC_VERSION: "v2.28.0"
  GOVULNCHECK_VERSION: "v1.1.4"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'web/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'cmd/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/ci.yml'
            app:
              - 'web/**'
              - 'cmd/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/ci.yml'

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        run: npm run lint
        working-directory: web

      - name: Unit Tests
        run: npm run test
        working-directory: web

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Postgres runs the dual-DB tests against a real server. Without it those tests only
    # exercise SQLite, so a migration or query that is invalid for Postgres merges green
    # and only breaks when someone starts the app against Postgres.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: warden
          POSTGRES_PASSWORD: warden
          POSTGRES_DB: warden
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6

      - name: Security Scan (gosec)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }}
          gosec -exclude-dir=web ./...

      - name: Vulnerability Check (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          govulncheck ./...

      - name: Dependency Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Allow unprivileged ICMP
        # Ping monitors need this, and without it the tests that prove ping works skip
        # instead of running, leaving the feature uncovered. Same knob operators set.
        run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"

      - name: Ping tests with ICMP allowed
        # Asserted rather than trusted: the main suite runs without -v, so a ping test
        # that quietly went back to skipping would leave no trace.
        run: |
          set -o pipefail
          go test ./internal/uptime -run 'TestProbePing' -v | tee icmp-allowed.log
          grep -q -- '--- PASS: TestProbePingLoopback' icmp-allowed.log

      - name: Unit Tests
        env:
          TEST_POSTGRES_URL: postgres://warden:warden@localhost:5432/warden?sslmode=disable
        run: |
          go clean -testcache
          go test ./...

      - name: Ping tests without ICMP permission
        # The other half: with ICMP denied, the checks must report the missing
        # permission rather than claiming the host is down. This is what a default
        # Kubernetes pod looks like.
        run: |
          set -o pipefail
          sudo sysctl -w net.ipv4.ping_group_range="1 0"
          go test ./internal/uptime -run 'TestProbePing|TestPingPermission' -v | tee icmp-denied.log
          # A skipped test passes, so assert the one that matters actually ran. This
          # step would otherwise stay green while covering nothing.
          grep -q -- '--- PASS: TestPingPermissionErrorIsActionable' icmp-denied.log

  e2e:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    # The official Playwright image ships the browsers and their OS libraries already
    # installed. That removes the `playwright install --with-deps` step, which ran apt on
    # every single run and is what hung CI for 110 minutes on 2026-08-15 and again on
    # 2026-08-18 — an unresponsive Ubuntu mirror with nothing to time it out.
    #
    # Keep the tag in step with @playwright/test in web/package-lock.json. A mismatch makes
    # Playwright re-download browsers at runtime, which puts the slow path straight back.
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --user 1001
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build Frontend
        working-directory: web
        run: npm run build

      - name: Build Backend
        run: go build -o warden ./cmd/dashboard

      # Starting the server and running the tests have to share a step. Every `run:` in a
      # container job is its own `docker exec`, and a process backgrounded in one exec does
      # not survive it — the server was being killed the moment its step ended, which the
      # tests then saw as ERR_CONNECTION_REFUSED.
      #
      # The wait is a real health check rather than `sleep 5`, which passed whether or not
      # the server had come up and turned a startup failure into a confusing test failure
      # thirty lines later.
      - name: Run E2E Tests
        env:
          ADMIN_SECRET: warden-e2e-magic-key
          PLAYWRIGHT_BASE_URL: http://localhost:9096
        run: |
          rm -f warden.db
          ./warden > warden.log 2>&1 &
          server_pid=$!

          echo "Waiting for the server to answer on :9096..."
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:9096/healthz; then
              echo "Server is up."
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "::error::The server exited before it became healthy."
              cat warden.log
              exit 1
            fi
            sleep 1
          done

          if ! curl -sf -o /dev/null http://localhost:9096/healthz; then
            echo "::error::The server never became healthy within 60s."
            cat warden.log
            exit 1
          fi

          # The server log is where a 500 during a test actually gets explained, so print it
          # whichever way the run goes.
          set +e
          (cd web && npx playwright test --fail-on-flaky-tests)
          status=$?
          set -e

          echo "----- server log -----"
          cat warden.log
          exit $status
