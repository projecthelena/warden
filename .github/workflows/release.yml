name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'What do you want to publish?'
        required: true
        default: 'release candidate'
        type: choice
        options:
        - release candidate
        - release

concurrency:
  group: warden-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check Helm chart credentials
        if: inputs.channel == 'release'
        env:
          HELM_CHARTS_DEPLOY_KEY: ${{ secrets.HELM_CHARTS_DEPLOY_KEY }}
        run: |
          if [ -z "$HELM_CHARTS_DEPLOY_KEY" ]; then
            echo "::error::Configure HELM_CHARTS_DEPLOY_KEY before publishing a stable release."
            exit 1
          fi

      - name: Determine Next Version
        id: version
        run: |
          CHANNEL=stable
          if [ "${{ inputs.channel }}" = "release candidate" ]; then
            CHANNEL=rc
          fi
          python3 .github/scripts/next_version.py --channel "$CHANNEL" --github-output "$GITHUB_OUTPUT"

      - name: Summarize Version
        run: |
          {
            echo "## ${{ steps.version.outputs.tag }}"
            echo
            echo "Calculated automatically from Conventional Commits since ${{ steps.version.outputs.stable }}."
            echo
            echo "Semantic bump: **${{ steps.version.outputs.bump }}**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Build Changelog
        id: build_changelog
        run: |
          # Diff against the last stable tag, skipping pre-releases, so a stable release cut
          # after an rc lists everything since the previous stable, not just since the rc.
          LATEST_TAG=$(git tag --sort=-v:refname | grep -v "^${{ steps.version.outputs.tag }}$" | grep -vF -e '-' | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            RAW=$(git log --pretty=format:"COMMIT_START%nSUBJECT:%s%nBODY:%b%nCOMMIT_END" --no-merges)
          else
            RAW=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"COMMIT_START%nSUBJECT:%s%nBODY:%b%nCOMMIT_END" --no-merges)
          fi

          # Extract individual changelog entries from commits
          # For squash merges with "* type: msg" body lines, use those instead of the subject
          ENTRIES=""
          SUBJECT=""
          BODY_ENTRIES=""
          IN_COMMIT=false

          while IFS= read -r line; do
            if [ "$line" = "COMMIT_START" ]; then
              IN_COMMIT=true
              SUBJECT=""
              BODY_ENTRIES=""
              continue
            fi

            if [ "$line" = "COMMIT_END" ]; then
              if [ -n "$BODY_ENTRIES" ]; then
                ENTRIES="${ENTRIES}${BODY_ENTRIES}"
              elif [ -n "$SUBJECT" ]; then
                ENTRIES="${ENTRIES}${SUBJECT}"$'\n'
              fi
              IN_COMMIT=false
              continue
            fi

            if [[ "$line" == SUBJECT:* ]]; then
              SUBJECT="${line#SUBJECT:}"
              continue
            fi

            if [[ "$line" == BODY:* ]]; then
              line="${line#BODY:}"
            fi

            # Parse body lines that match "* type: msg" pattern
            if [[ "$line" == \** ]]; then
              entry=$(echo "$line" | sed -E 's/^\* *//')
              if echo "$entry" | grep -qiE "^(feat|fix|perf|refactor|build|ci|chore|test|docs)(\(.*\))?:"; then
                BODY_ENTRIES="${BODY_ENTRIES}${entry}"$'\n'
              fi
            fi
          done <<< "$RAW"

          FEATURES=""
          FIXES=""
          PERFORMANCE=""
          REFACTOR=""
          CHORE=""
          OTHER=""

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            if echo "$line" | grep -qiE "^feat(\(.*\))?:"; then
              msg=$(echo "$line" | sed -E 's/^feat(\(.*\))?: *//')
              FEATURES="${FEATURES}- ${msg}\n"
            elif echo "$line" | grep -qiE "^fix(\(.*\))?:"; then
              msg=$(echo "$line" | sed -E 's/^fix(\(.*\))?: *//')
              FIXES="${FIXES}- ${msg}\n"
            elif echo "$line" | grep -qiE "^perf(\(.*\))?:"; then
              msg=$(echo "$line" | sed -E 's/^perf(\(.*\))?: *//')
              PERFORMANCE="${PERFORMANCE}- ${msg}\n"
            elif echo "$line" | grep -qiE "^refactor(\(.*\))?:"; then
              msg=$(echo "$line" | sed -E 's/^refactor(\(.*\))?: *//')
              REFACTOR="${REFACTOR}- ${msg}\n"
            elif echo "$line" | grep -qiE "^(build|ci|chore|test|docs)(\(.*\))?:"; then
              msg=$(echo "$line" | sed -E 's/^(build|ci|chore|test|docs)(\(.*\))?: *//')
              CHORE="${CHORE}- ${msg}\n"
            else
              OTHER="${OTHER}- ${line}\n"
            fi
          done <<< "$ENTRIES"

          CHANGELOG=""
          [ -n "$FEATURES" ] && CHANGELOG="${CHANGELOG}## 🚀 Features\n${FEATURES}\n"
          [ -n "$FIXES" ] && CHANGELOG="${CHANGELOG}## 🐛 Bug Fixes\n${FIXES}\n"
          [ -n "$PERFORMANCE" ] && CHANGELOG="${CHANGELOG}## ⚡ Performance\n${PERFORMANCE}\n"
          [ -n "$REFACTOR" ] && CHANGELOG="${CHANGELOG}## ♻️ Refactor\n${REFACTOR}\n"
          [ -n "$CHORE" ] && CHANGELOG="${CHANGELOG}## 📦 Build & Chore\n${CHORE}\n"
          [ -n "$OTHER" ] && CHANGELOG="${CHANGELOG}## 📝 Other\n${OTHER}\n"

          # Write to file to preserve formatting
          echo -e "$CHANGELOG" > /tmp/changelog.md
          echo "changelog_file=/tmp/changelog.md" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body_path: ${{ steps.build_changelog.outputs.changelog_file }}
          draft: false
          # A tag with a hyphen is a pre-release (e.g. v0.4.0-rc.1): it gets the pre-release
          # badge and never shows as the latest stable release.
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}

  trigger-docker:
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.release.outputs.tag }}
    secrets: inherit

  update-helm-chart:
    name: Update Helm chart
    needs:
      - release
      - trigger-docker
    if: ${{ !contains(needs.release.outputs.tag, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Warden
        uses: actions/checkout@v7

      - name: Checkout Helm charts
        uses: actions/checkout@v7
        with:
          repository: projecthelena/helm-charts
          ref: main
          path: helm-charts
          ssh-key: ${{ secrets.HELM_CHARTS_DEPLOY_KEY }}

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.22.0

      - name: Update, validate, and push Helm chart
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        working-directory: helm-charts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 ../.github/scripts/update_helm_chart.py \
              --chart charts/warden/Chart.yaml \
              --values charts/warden/values.yaml \
              --release "$RELEASE_TAG"
            if git diff --quiet; then
              echo "Chart already deploys $RELEASE_TAG."
              exit 0
            fi
            helm lint charts/warden
            helm template warden charts/warden >/dev/null
            git add charts/warden/Chart.yaml charts/warden/values.yaml
            git commit -m "chore(warden): update chart for $RELEASE_TAG"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push failed on attempt $attempt; retrying from current main."
          done
          echo "::error::Could not push the Helm chart after three attempts."
          exit 1

  update-dockerhub-description:
    name: Update Docker Hub description
    needs: [release, trigger-docker]
    if: ${{ !contains(needs.release.outputs.tag, '-') }}
    permissions:
      contents: read
    uses: ./.github/workflows/dockerhub-description.yml
    secrets: inherit
