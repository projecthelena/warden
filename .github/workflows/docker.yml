name: Build and Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag to publish (required for images)"
        required: false
        type: string
      description_only:
        description: "Update Docker Hub description without building images"
        required: true
        default: false
        type: boolean
  workflow_call:
    inputs:
      update_latest:
        description: "Promote a new stable release to latest"
        required: false
        default: false
        type: boolean
      version:
        description: "Version tag (e.g. v1.0.1)"
        required: false
        type: string
      description_only:
        description: "Only update Docker Hub metadata"
        required: false
        default: false
        type: boolean

concurrency:
  group: warden-docker-publish
  cancel-in-progress: false

env:
  GHCR_IMAGE_NAME: ghcr.io/projecthelena/warden
  DOCKERHUB_IMAGE_NAME: jesuspaz/warden

jobs:
  build:
    name: Build ${{ matrix.platform }}
    if: ${{ !inputs.description_only }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Validate release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$ ]]; then
            echo "::error::An existing release tag is required to publish images."
            exit 1
          fi

      - name: Checkout release
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE_NAME }}
            ${{ env.DOCKERHUB_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ inputs.update_latest && !contains(inputs.version, '-') }}
          flavor: |
            suffix=-${{ matrix.arch }}

      - name: Build and push (${{ matrix.platform }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
             VERSION=${{ inputs.version }}
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  manifest:
    name: Publish multi-arch manifests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE_NAME }}
            ${{ env.DOCKERHUB_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ inputs.update_latest && !contains(inputs.version, '-') }}

      - name: Create multi-arch manifests
        env:
          VERSION: ${{ inputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker buildx imagetools create \
              -t "$tag" \
              "${tag%:*}:$VERSION-amd64" \
              "${tag%:*}:$VERSION-arm64"
          done <<< "$TAGS"

  description:
    name: Update Docker Hub description
    if: ${{ inputs.description_only }}
    permissions:
      contents: read
    uses: ./.github/workflows/dockerhub-description.yml
    secrets: inherit
